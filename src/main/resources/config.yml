# Automatically make every non-legacy Bukkit Material available as :material_name:.
# Vanilla texture paths are used when no same-named custom PNG exists.
auto-material-emojis: true

# Each interception surface can be disabled independently.
surfaces:
  chat: true
  tab: true
  scoreboard: true
  holograms: true
  menus: true
  items: true
  dialogs: true
  signs: true
  books: true
  boss-bars: true

# ProtocolLib enables packet coverage for content emitted by other plugins.
packets:
  enabled: true

resource-pack:
  # Not needed for vanilla item/block sprite emojis. Enable only for custom PNG glyphs.
  enabled: false
  generate-on-startup: false
  send-on-join: false
  required: false
  prompt: "Accept the optional AstraEmojis pack for custom-image emojis."
  # Public URL is strongly recommended. If blank, the embedded server URL is used.
  public-url: ""
  embedded-server:
    enabled: true
    bind: "0.0.0.0"
    port: 8127
  # Optional custom-image pack format for 1.21.11. Native sprites ignore this setting.
  pack-format: 75
  ascent: 8
  height: 9
  namespace: "astraemojis"
  font: "minecraft:default"

messages:
  prefix: "<gold><bold>AstraEmojis</bold></gold> <dark_gray>»</dark_gray> "
  no-permission: "<red>You do not have permission.</red>"
  reloaded: "<green>Configuration and emojis were reloaded.</green>"
