# Sprite entries use textures already shipped with Minecraft 1.21.9+ and need no pack.
# Atlas is inferred as minecraft:items or minecraft:blocks when omitted.
# Custom aliases can point to any vanilla atlas sprite.
emojis:
  lime_wool:
    sprite: "minecraft:block/lime_wool"
    permission: "astraemojis.use.lime_wool"
  pink_harness:
    sprite: "minecraft:item/pink_harness"
    permission: "astraemojis.use.pink_harness"
  netherite_sword:
    sprite: "minecraft:item/netherite_sword"
    permission: "astraemojis.use.netherite_sword"
  donut:
    sprite: "minecraft:item/cookie"
    permission: ""

# Optional resource-pack glyph format (only when resource-pack.enabled is true):
#  custom_logo:
#    char: "U+E001"
#    permission: "astraemojis.use.custom_logo"
